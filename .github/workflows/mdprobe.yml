# Builds mdProbe (tools/mdtrace/build_mdprobe.sh: the emulated Machinedrum that the desktop plugin's flash-image import boots) on Windows,
# and keeps the artifact for the desktop build. Separate from desktop.yml because it fetches and patches the whole gearmulator-md-mm tree.
name: mdprobe

on:
  push:
    paths: ['tools/mdtrace/**', 'tools/mdimport/**', 'libs/gearmulator-md-mm', '.github/workflows/mdprobe.yml']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: Keep LF line endings (the patches are applied with git apply)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build mdProbe
        shell: bash
        env:
          MDPROBE_GENERATOR: Ninja
        run: |
          git submodule update --init --depth 1 libs/gearmulator-md-mm
          bash tools/mdtrace/build_mdprobe.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mdprobe-windows-x64
          path: libs/gearmulator-md-mm/build/source/elektron/md/mdLibTest/mdProbe.exe
          if-no-files-found: error
